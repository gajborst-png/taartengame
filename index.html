<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Taartenbakkerij</title>
<meta name="theme-color" content="#ff9ec0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Taartenbakkerij">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">

<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--L:#6e5a7e;--ink:#5d4a6e;--soft:#9a88a8;--pink:#ff9ec0;--pinkd:#e9799f;--mint:#7fd8bf;--lila:#c9b8ff;--yellow:#ffe79a;--line:#eadcf2;--red:#ff5a7e}
*{box-sizing:border-box}
html{touch-action:manipulation}
html,body{margin:0}
body{font-family:'Baloo 2',system-ui,sans-serif;color:var(--ink);font-size:20px;min-height:100vh;background:#fff3f8 radial-gradient(#ffdcec 2.5px,transparent 3px) 0 0/30px 30px}
button,input{-webkit-tap-highlight-color:transparent;font-family:inherit}
button{cursor:pointer}
svg{display:inline-block;vertical-align:middle;overflow:visible}
header{display:flex;align-items:center;gap:10px;padding:10px 20px;max-width:1060px;margin:0 auto}
header .home{background:#fff;border:3px solid var(--L);border-radius:16px;padding:2px 8px;box-shadow:0 4px 0 var(--L)}
header .title{font-weight:800;font-size:26px;flex:1;color:var(--L)}
header .chip{background:#fff;border:3px solid var(--L);border-radius:999px;padding:0 14px;font-weight:800;font-size:22px;color:var(--L)}
header .gear{font-size:16px;font-weight:700;background:#fff;border:3px solid var(--line);border-radius:14px;padding:4px 10px;color:var(--soft)}
@media(max-width:640px){header .title{font-size:18px}header .chip{font-size:17px;padding:0 8px}header .gear{display:none}}
main{max-width:1060px;margin:0 auto;padding:4px 20px 60px}
.steps{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:4px 0 14px}
.steps span{background:#fff;border:2px solid var(--line);border-radius:999px;padding:0 12px;font-size:16px;color:var(--soft)}
.steps span.on{background:var(--pink);border-color:var(--L);color:#fff;font-weight:800}
.steps span.done{background:#e6f8f1;border-color:#bfe8d8;color:#3f9c80}
.panel{background:#fff;border:3px solid var(--L);border-radius:30px;padding:20px 24px;box-shadow:0 6px 0 #e3d3ee;margin-bottom:20px}
.center{text-align:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.grid2b{display:grid;grid-template-columns:360px 1fr;gap:20px}
@media(max-width:780px){.grid2,.grid2b{grid-template-columns:1fr}}
h2{margin:0 0 8px;font-size:30px;line-height:1.15;color:var(--L)}
h3{margin:0 0 8px;font-size:24px;color:var(--L)}
h3.withimg{display:flex;align-items:center;gap:8px}
p{margin:6px 0}
.small{font-size:16px;color:var(--soft)}
.q{font-size:23px;line-height:1.4}
.big{font-size:24px;font-weight:800;background:var(--pink);color:#fff;border:3px solid var(--L);border-radius:22px;padding:8px 26px;margin:8px 6px;box-shadow:0 5px 0 var(--L);text-shadow:0 2px 0 rgba(110,90,126,.35)}
.big.mint{background:var(--mint)}.big.lila{background:var(--lila)}
.big:hover{filter:brightness(1.05)}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 var(--L)}
.big:disabled{background:#e4dcea;color:#fff;box-shadow:0 5px 0 #c9bcd4;border-color:#c9bcd4;cursor:default;text-shadow:none}
.btnrow{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
input.txt{font-size:30px;padding:8px 16px;border:3px solid var(--L);border-radius:18px;width:100%;max-width:360px;color:var(--ink);text-align:center;background:#fffafc}
input.txt:focus{outline:none;border-color:var(--pink);box-shadow:0 0 0 4px #ffe0ee}
.speak{border:2px solid var(--line);background:#fff;border-radius:12px;margin-left:8px;vertical-align:middle;padding:2px 4px}
.walkin{display:block;width:max-content;margin:0 auto;animation:walk .8s ease-out}
.blockc{display:block;width:max-content;margin:0 auto}
@keyframes walk{from{transform:translateX(-160px) rotate(-10deg);opacity:0}to{transform:none;opacity:1}}
.bubble{display:inline-block;background:#fff;border:3px solid var(--L);border-radius:26px;padding:12px 22px;font-size:28px;font-weight:700;position:relative;margin:10px 0 16px;max-width:640px;line-height:1.3}
.bubble:before{content:"";position:absolute;top:-17px;left:50%;margin-left:-12px;border-left:12px solid transparent;border-right:12px solid transparent;border-bottom:16px solid var(--L)}
.orderhead{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}
.pair{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.card{background:#fffafc;border:3px solid var(--line);border-radius:22px;padding:8px 8px 10px;text-align:center;font-size:19px;font-weight:700;color:var(--ink);overflow-wrap:anywhere}
button.card:hover{border-color:var(--pink);transform:translateY(-2px)}
.card.locked{opacity:.5;filter:grayscale(.85)}
.card .need{font-size:15px;color:var(--soft);font-weight:500}
.card ul{list-style:none;padding:0;margin:6px 0 0;font-size:15px;font-weight:500;text-align:left}
.card li{display:flex;align-items:center;gap:4px}
.rlist{list-style:none;padding:0;margin:0}
.rlist li{display:flex;align-items:center;gap:8px;padding:3px 10px;border-radius:14px;margin-bottom:5px;background:#fffafc;border:2px solid var(--line);font-size:20px}
.rlist .cnt{margin-left:auto;font-weight:800;color:var(--soft);white-space:nowrap}
.rlist li.done{background:#e6f8f1;border-color:#bfe8d8}.rlist li.done .cnt{color:#3f9c80}
.rlist li.done .cnt:after{content:" ✓"}
.rlist li.over{background:#ffe3ea;border-color:#ffb8c8}.rlist li.over .cnt{color:var(--red)}
.hint{background:#fff7d6;border:2px dashed #f0d27a;border-radius:14px;padding:6px 14px;display:inline-block;font-size:19px;margin:4px 0}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.ing{background:#fffafc;border:3px solid var(--line);border-radius:20px;padding:6px 4px;font-size:17px;font-weight:700;color:var(--ink);display:flex;flex-direction:column;align-items:center}
.ing:hover{border-color:var(--pink);transform:translateY(-2px)}
.bowl{min-height:160px;background:#eef7ff;border:3px solid var(--L);border-top:none;border-radius:0 0 140px 140px;padding:14px 34px 40px;display:flex;flex-wrap:wrap;justify-content:center;align-content:flex-start;gap:2px}
.bowl button{background:none;border:none;padding:0}
.bowl button:hover{transform:scale(1.15)}
.mixbowl{cursor:pointer;user-select:none;display:inline-block}
.mixbowl:active{transform:scale(.97)}
.bar{height:22px;background:#f3e8f6;border:2px solid var(--line);border-radius:999px;overflow:hidden;max-width:420px;margin:10px auto}
.bar div{height:100%;background:var(--mint);width:0;transition:width .25s}
.dial{display:inline-block;font-size:46px;font-weight:800;background:#5d4a6e;color:#ffb36b;border:3px solid var(--L);border-radius:18px;padding:0 24px;margin:8px 0;min-width:200px;text-align:center}
.dbtn{font-size:24px;font-weight:800;background:#fff;border:3px solid var(--L);box-shadow:0 4px 0 var(--L);border-radius:14px;padding:4px 16px;color:var(--L);margin:4px 2px}
.dbtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--L)}
.opts{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin:10px 0}
.opt{font-size:26px;font-weight:800;background:#fff;border:3px solid var(--L);box-shadow:0 5px 0 var(--L);border-radius:20px;padding:6px 22px;color:var(--L)}
.opt:hover{background:#fff0f6}
.decos,.faces{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:12px 0}
.decos button,.facebtn{background:#fffafc;border:3px solid var(--L);box-shadow:0 5px 0 var(--L);border-radius:18px;padding:4px 6px;color:var(--ink);display:flex;flex-direction:column;align-items:center;min-width:84px}
.decos button small,.facebtn span{font-size:15px;font-weight:700}
.decos button:active,.facebtn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--L)}
.facebtn.on{background:#fff0f6;border-color:var(--pinkd);box-shadow:0 5px 0 var(--pinkd);transform:scale(1.08)}
.wish{display:inline-flex;align-items:center;gap:6px;background:#fff0f6;border:3px dashed var(--pink);border-radius:18px;padding:4px 16px;font-size:22px;margin:4px 0}
.payrow{display:flex;justify-content:center;align-items:center;gap:18px;flex-wrap:wrap;margin:8px 0}
.tag{background:#fff7d6;border:3px dashed #e8c35a;border-radius:18px;padding:6px 16px;font-size:19px}
.tag b{display:block;font-size:36px}
.times{font-size:40px;font-weight:800;color:var(--L)}
.answer{font-size:44px;font-weight:800;border:3px solid var(--L);border-radius:18px;display:inline-block;min-width:160px;padding:0 20px;margin:6px 0;color:var(--L)}
.keypad{display:grid;grid-template-columns:repeat(3,80px);gap:9px;justify-content:center;margin-top:8px}
.keypad button{font-size:30px;font-weight:800;height:62px;background:#fff;border:3px solid var(--L);box-shadow:0 4px 0 var(--L);border-radius:16px;color:var(--L)}
.keypad button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--L)}
.keypad button.ok{background:var(--mint);color:#fff}
.bon{background:#fffdf5;border:3px dashed #d9c7e2;border-radius:16px;padding:8px 16px;margin:10px auto;max-width:260px;text-align:center;font-size:18px}
.bon .nm{font-size:34px;font-weight:800;display:block;color:var(--L)}
.cupbox{display:inline-block;background:#ffe0ec;border:3px solid var(--L);border-radius:12px;padding:2px 18px;font-weight:800;font-size:26px;min-width:160px;min-height:46px;margin-top:6px;font-style:italic;color:var(--L)}
.earned{display:inline-block;text-align:left;font-size:22px;margin:8px 0}
.earned div{padding:2px 0}
.earned .off{opacity:.55}
.unlock{background:#fff0f6;border:3px solid var(--pink);border-radius:22px;padding:10px 20px;margin:10px auto;max-width:520px;animation:pop .5s}
@keyframes pop{0%{transform:scale(.5);opacity:0}80%{transform:scale(1.05)}to{transform:none;opacity:1}}
.scenep{padding:14px}
.scene{max-width:620px;display:block;margin:0 auto 6px}
.decor{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:8px 0}
.decor span{animation:pop .5s}
.progress{height:22px;background:#f3e8f6;border:2px solid var(--line);border-radius:999px;overflow:hidden;max-width:420px;margin:6px auto}
.progress div{height:100%;background:var(--yellow)}
.lvl{font-size:15px;color:var(--soft)}
.shopgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.shopitem{background:#fffafc;border:3px solid var(--line);border-radius:20px;padding:8px;text-align:center}
.shopitem .pr{font-weight:800;font-size:22px;color:var(--L)}
.shopitem.own{background:#e6f8f1;border-color:#bfe8d8}
.shopitem button{font-size:18px;font-weight:800;border:3px solid var(--L);border-radius:14px;padding:2px 16px;background:var(--mint);color:#fff;box-shadow:0 3px 0 var(--L)}
.shopitem button:disabled{background:#e4dcea;border-color:#c9bcd4;box-shadow:0 3px 0 #c9bcd4}
.cnt-badge{font-size:15px;color:#3f9c80;font-weight:700}
.overlay{position:fixed;inset:0;background:rgba(110,90,126,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal{background:#fff;border:3px solid var(--L);border-radius:28px;padding:22px 26px;max-width:480px;width:100%;max-height:92vh;overflow:auto}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 14px}
.seg button{flex:1;font-size:18px;font-weight:700;border:3px solid var(--line);background:#fff;border-radius:12px;padding:6px;color:var(--ink)}
.seg button.on{background:var(--pink);border-color:var(--L);color:#fff}
.reset{background:none;border:none;color:var(--soft);font-size:15px;text-decoration:underline;margin-top:16px}
.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(200px);background:var(--L);color:#fff;font-size:22px;font-weight:700;padding:12px 24px;border-radius:20px;border:3px solid #fff;max-width:90vw;text-align:center;transition:transform .3s,visibility .3s;visibility:hidden;z-index:60;box-shadow:0 6px 0 rgba(110,90,126,.3)}
#toast.show{transform:translateX(-50%);visibility:visible}
#toast.good{background:#4fb89c}
.confetti{position:fixed;top:-50px;z-index:30;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.fly{position:fixed;z-index:40;pointer-events:none;transition:transform .5s cubic-bezier(.3,-.4,.6,1),opacity .5s}

html,body{overscroll-behavior:none}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
input{-webkit-user-select:text;user-select:text}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<script>
/* ===================== ART (chibi-kawaii) ===================== */
const L='#6e5a7e';
const SK=`stroke="${L}" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"`;
const S3=`stroke="${L}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"`;
const SF=`fill="none" ${SK}`;
function lum(h){h=h.replace('#','');const n=parseInt(h,16);return(.299*(n>>16)+.587*((n>>8)&255)+.114*(n&255))/255}
function mix(a,b,t){const p=h=>{h=h.replace('#','');const n=parseInt(h,16);return[n>>16,(n>>8)&255,n&255]};const x=p(a),y=p(b);return'#'+x.map((v,i)=>Math.round(v+(y[i]-v)*t).toString(16).padStart(2,'0')).join('')}

/* kawaii face. t: blij | knipoog | verliefd | tevreden | tong | oh */
function face(cx,cy,s=1,t='blij',ink=L){
 const ex=7*s,er=2.6*s,w=(1.7*s).toFixed(2);
 const st=`stroke="${ink}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"`;
 const dot=x=>`<ellipse cx="${x}" cy="${cy}" rx="${er}" ry="${er*1.25}" fill="${ink}"/><circle cx="${x+er*.4}" cy="${cy-er*.5}" r="${er*.42}" fill="${ink===L?'#fff':L}"/>`;
 const arc=x=>`<path d="M${x-er*1.3} ${cy+er*.5} Q${x} ${cy-er*1.7} ${x+er*1.3} ${cy+er*.5}" fill="none" ${st}/>`;
 const heart=x=>`<path d="M${x} ${cy+er*1.5} L${x-er*1.6} ${cy} Q${x-er*1.9} ${cy-er*1.7} ${x} ${cy-er*.7} Q${x+er*1.9} ${cy-er*1.7} ${x+er*1.6} ${cy}Z" fill="#ff5a7e"/>`;
 const wink=x=>`<path d="M${x+er*1.1} ${cy-er} L${x-er*.9} ${cy} L${x+er*1.1} ${cy+er}" fill="none" ${st}/>`;
 const my=cy+4*s;
 const smile=`<path d="M${cx-3*s} ${my} Q${cx} ${my+3*s} ${cx+3*s} ${my}" fill="none" ${st}/>`;
 const open=`<path d="M${cx-3.6*s} ${my-.4*s} Q${cx} ${my+5.5*s} ${cx+3.6*s} ${my-.4*s}Z" fill="#ff7aa5" ${st}/>`;
 const cat=`<path d="M${cx-4*s} ${my} Q${cx-2*s} ${my+2.6*s} ${cx} ${my} Q${cx+2*s} ${my+2.6*s} ${cx+4*s} ${my}" fill="none" ${st}/>`;
 const tongue=`<path d="M${cx-3.6*s} ${my-.4*s} Q${cx} ${my+2*s} ${cx+3.6*s} ${my-.4*s}" fill="none" ${st}/><path d="M${cx-1.8*s} ${my+.6*s} Q${cx-1.8*s} ${my+4.4*s} ${cx} ${my+4.4*s} Q${cx+1.8*s} ${my+4.4*s} ${cx+1.8*s} ${my+.6*s}Z" fill="#ff7aa5" ${st}/>`;
 const oh=`<ellipse cx="${cx}" cy="${my+1.2*s}" rx="${1.6*s}" ry="${2*s}" fill="#ff7aa5" ${st}/>`;
 const blush=`<ellipse cx="${cx-ex-4.5*s}" cy="${cy+3.6*s}" rx="${3.2*s}" ry="${1.9*s}" fill="#ffadc6"/><ellipse cx="${cx+ex+4.5*s}" cy="${cy+3.6*s}" rx="${3.2*s}" ry="${1.9*s}" fill="#ffadc6"/>`;
 const E={blij:[dot,dot,smile],knipoog:[dot,wink,open],verliefd:[heart,heart,open],tevreden:[arc,arc,cat],tong:[arc,wink,tongue],oh:[dot,dot,oh]}[t]||[dot,dot,smile];
 return blush+E[0](cx-ex)+E[1](cx+ex)+E[2];
}
const FACES=[['blij','Blij'],['knipoog','Knipoog'],['verliefd','Verliefd'],['tevreden','Tevreden'],['tong','Tong uit']];
const FACE_SAY={blij:'Hij lacht naar me!',knipoog:'Hij knipoogt naar me!',verliefd:'Wat een verliefd gezichtje!',tevreden:'Hij kijkt zo tevreden!',tong:'Haha, hij steekt zijn tong uit!'};

/* icons in a 100x100 box; f = draw a face */
const ICON={
 appel:f=>`<path d="M50 32 Q34 18 20 30 Q6 46 14 68 Q24 92 42 90 Q50 87 58 90 Q76 92 86 68 Q94 46 80 30 Q66 18 50 32Z" fill="#ff7a8a" ${SK}/><path d="M50 32 Q50 20 56 12" ${SF}/><path d="M56 20 Q68 8 80 16 Q70 28 56 20Z" fill="#8fd6a8" ${SK}/>${f?face(50,60,1.7):''}`,
 peer:f=>`<path d="M50 16 Q40 16 40 32 Q40 42 32 52 Q16 68 26 82 Q36 94 50 92 Q64 94 74 82 Q84 68 68 52 Q60 42 60 32 Q60 16 50 16Z" fill="#cde88a" ${SK}/><path d="M50 16 L52 6" ${SF}/><path d="M53 10 Q64 2 72 10 Q62 18 53 10Z" fill="#8fd6a8" ${SK}/>${f?face(50,70,1.5):''}`,
 ei:f=>`<ellipse cx="50" cy="54" rx="30" ry="38" fill="#fffaf0" ${SK}/>${f?face(50,60,1.7):''}`,
 bloem:f=>`<path d="M24 36 Q18 88 28 92 L72 92 Q82 88 76 36Z" fill="#f6e3c4" ${SK}/><path d="M26 36 Q34 20 50 28 Q66 20 74 36 Q50 44 26 36Z" fill="#fffaf0" ${SK}/>${f?face(50,64,1.6):''}`,
 suiker:f=>`<rect x="20" y="22" width="60" height="64" rx="14" fill="#ffffff" ${SK}/><path d="M24 38 L76 38" stroke="#ffd6e6" stroke-width="7" stroke-linecap="round"/><path d="M14 18 l3 6 l6 3 l-6 3 l-3 6 l-3 -6 l-6 -3 l6 -3Z" fill="#ffc6dc"/>${f?face(50,62,1.6):''}`,
 boter:f=>`<ellipse cx="50" cy="78" rx="42" ry="11" fill="#e9f3ff" ${SK}/><path d="M22 74 L22 46 Q22 36 32 36 L68 36 Q78 36 78 46 L78 74Z" fill="#ffe27a" ${SK}/><path d="M28 44 L72 44" stroke="#fff6c4" stroke-width="6" stroke-linecap="round"/>${f?face(50,60,1.5):''}`,
 kwark:f=>`<path d="M22 36 L30 88 Q50 94 70 88 L78 36Z" fill="#ffffff" ${SK}/><ellipse cx="50" cy="34" rx="30" ry="9" fill="#9fd0ff" ${SK}/>${f?face(50,62,1.6):''}`,
 chocolade:f=>`<rect x="24" y="12" width="52" height="78" rx="8" fill="#8a5a44" ${SK}/><path d="M50 14 L50 52 M26 33 L74 33" fill="none" stroke="#6b4434" stroke-width="3"/><path d="M24 54 L76 54 L76 82 Q76 90 68 90 L32 90 Q24 90 24 82Z" fill="#ff9ec0" ${SK}/>${f?face(50,71,1.3):''}`,
 aardbei:f=>`<path d="M50 90 Q20 70 18 46 Q18 28 34 28 L66 28 Q82 28 82 46 Q80 70 50 90Z" fill="#ff6f8f" ${SK}/><path d="M30 30 L38 14 L50 24 L62 14 L70 30 Q50 38 30 30Z" fill="#8fd6a8" ${SK}/><g fill="#fff3b0"><circle cx="30" cy="46" r="2.6"/><circle cx="70" cy="46" r="2.6"/><circle cx="40" cy="74" r="2.6"/><circle cx="60" cy="74" r="2.6"/></g>${f?face(50,54,1.5):''}`,
 banaan:f=>`<path d="M16 32 Q20 84 72 86 Q90 84 90 72 Q58 70 44 54 Q30 38 30 20 Q18 18 16 32Z" fill="#ffe27a" ${SK}/><path d="M22 20 L26 10" ${SF}/>${f?face(42,62,1.25):''}`,

  <div class="btnrow"><button class="big" onclick="newRound()">Open de winkel!</button><button class="big lila" onclick="showBook(false)">Recepten</button><button class="big mint" onclick="showShop()">Inrichten</button></div>
  ${owned.length?`<div class="decor">${owned.map(i=>`<span title="${i[1]}">${ico(i[0],46)}</span>`).join('')}</div>`:''}
  <p class="lvl">Niveau: ${LEVELS[lvl()]}</p></div>`);
}
function setBakery(){const v=$('bk').value.trim();if(!v){shake($('bk'));toast('Typ eerst een naam voor je bakkerij.');return}S.bakery=cap(v);save();sfx.ok();showHome()}

/* ---------- shop ---------- */
function showShop(){
 cur='shop';
 const items=SHOP.map(([id,n,p])=>{const own=S.items.includes(id);
  return `<div class="shopitem ${own?'own':''}" id="shop-${id}">${ico(id,72)}<div>${n}</div><div class="pr">€${p}</div>${own?'<div class="cnt-badge">✓ in je bakkerij</div>':`<button onclick="buy('${id}')" ${S.coins<p?'disabled':''}>Kopen</button>`}</div>`}).join('');
 frame(null,`<div class="panel center"><h2>Bakkerij inrichten</h2><p class="q">In je spaarpot zit ${coinI(26)} <b>€${S.coins}</b>. ${spk('In je spaarpot zit '+S.coins+' euro. Wat wil je kopen?')}</p><p class="small">Verdien geld door taarten te verkopen. Koop daarmee mooie spullen voor je bakkerij.</p></div>
 <div class="panel"><div class="shopgrid">${items}</div></div><div class="btnrow"><button class="big" onclick="showHome()">Terug</button></div>`);

function buy(id){const it=SHOP.find(i=>i[0]===id);if(!it||S.coins<it[2]||S.items.includes(id))return;
 const before=S.coins;S.coins-=it[2];S.items.push(id);save();sfx.coin();showShop();
 toast(`Je had €${before}. De ${it[1]} kost €${it[2]}. Nu heb je nog €${S.coins}.`,true);}

/* ---------- parent menu ---------- */
let gate=null;
function openParent(){
 const a=6+rnd(4),b=6+rnd(4);gate=a*b;
 const ov=document.createElement('div');ov.className='overlay';ov.id='ov';ov.onclick=e=>{if(e.target===ov)closeParent()};
 ov.innerHTML=`<div class="modal center"><h2>Voor ouders</h2><p class="q">Hoeveel is ${a} × ${b}?</p>
  <input class="txt" id="gateIn" inputmode="numeric" maxlength="3" onkeydown="if(event.key==='Enter')checkGate()"><br>
  <button class="big" onclick="checkGate()">Verder</button><button class="big lila" onclick="closeParent()">Sluiten</button></div>`;
 document.body.appendChild(ov);setTimeout(()=>$('gateIn')&&$('gateIn').focus(),50);
}
function closeParent(){const o=$('ov');if(o)o.remove();resetArmed=false}
function checkGate(){if(Number($('gateIn').value)!==gate){shake($('gateIn'));$('gateIn').value='';return}parentMenu()}
function parentMenu(){
 const o=$('ov');if(!o)return;const st=S.set;
 const seg=(key,opts)=>`<div class="seg">${opts.map(([v,l])=>`<button class="${st[key]===v?'on':''}" onclick="setOpt('${key}',${JSON.stringify(v).replace(/"/g,"'")})">${l}</button>`).join('')}</div>`;
 o.querySelector('.modal').innerHTML=`<h2>Instellingen</h2>
  <b>Niveau</b>${seg('level',[['makkelijk','Makkelijk'],['normaal','Normaal'],['uitdaging','Uitdaging']])}
  <p class="lvl">Makkelijk: alleen goede ingrediënten in de kast, 2 keuzes bij de klok, kleine wensen, totaalbedrag als hulp.<br>Normaal: verkeerde ingrediënten ertussen, 3 keuzes, wisselgeld van €10 of €20.<br>Uitdaging: soms 2 taarten of 12 cupcakes (alles dubbel), starttijd op een half uur, ook briefjes van €50.</p>
  <b>Geluid</b>${seg('sound',[[true,'Aan'],[false,'Uit']])}
  <b>Automatisch voorlezen</b>${seg('voice',[[true,'Aan'],[false,'Uit']])}
  <p class="small">Gespeeld: ${S.baked} bestellingen · ${S.stars} sterren · €${S.coins} in de spaarpot</p>
  <div class="center"><button class="big" onclick="closeParent();if(cur==='home')showHome()">Klaar</button><br>
  <button class="reset" id="rs" onclick="resetGame()">Alle voortgang wissen</button></div>`;
}
function setOpt(k,v){S.set[k]=v;save();parentMenu()}
function resetGame(){if(!resetArmed){resetArmed=true;$('rs').textContent='Zeker weten? Klik nog een keer: sterren, geld en spullen worden gewist.';return}
 S=Object.assign({},DEF,{set:S.set,items:[],counts:{}});save();closeParent();R=null;showHome()}

/* ---------- round ---------- */
function newRound(){
 const L_=lvl(),ul=unlocked();
 let r=pick(ul);while(ul.length>1&&HIST.length>=2&&HIST.slice(-2).every(id=>id===r.id))r=pick(ul);
 HIST.push(r.id);if(HIST.length>5)HIST.shift();
 let c=pick(CUST);while(CHIST.includes(c.n))c=pick(CUST);
 CHIST.push(c.n);if(CHIST.length>4)CHIST.shift();
 const cupOpts={makkelijk:[2,3,4],normaal:[2,3,4,5,6],uitdaging:[4,5,6,8,10,12]}[L_];
 const cups=isCup(r)?pick(cupOpts):0;
 const qty=isCup(r)?(cups>6?2:1):(L_==='uitdaging'&&S.baked>=2&&Math.random()<.35?2:1);
 const wishP={makkelijk:.3,normaal:.5,uitdaging:.6}[L_],wishMax={makkelijk:3,normaal:5,uitdaging:8}[L_];
 const wish=S.baked>=2&&Math.random()<wishP?{k:pick(Object.keys(DECO)),n:1+rnd(wishMax)}:null;
 let T=cakeName(r,qty,cups);if(wish)T+=' '+wishText(wish);
 const phrase=pick([`Mag ik ${T}?`,`Ik wil graag ${T}.`,`Ik ben jarig! Mag ik ${T}?`,`${cap(T)}, alsjeblieft!`,`Heb je ${T} voor mij?`]);
 const total=r.price*(isCup(r)?cups:qty);
 const notes=L_==='makkelijk'?[total<10?10:20]:L_==='normaal'?[10,20].filter(x=>x>total):[10,20,50].filter(x=>x>total);
 const start=(1+rnd(10))*60+(L_==='uitdaging'&&Math.random()<.5?30:0);
 let shelf=Object.keys(ING);if(L_==='makkelijk')shelf=shelf.filter(k=>r.ing[k]);
 R={recipe:r,cust:c,qty,cups,wish,phrase,total,paid:pick(notes),start,errA:false,errB:false,errW:false,wishTried:false,bowl:{},stirs:0,oven:0,ans:'',written:'',deco:[],face:null,shelf:shuffle(shelf)};
 showOrder();
}
function showOrder(){
 cur='order';const c=R.cust;const text=`Hallo! Ik ben ${c.n}. ${R.phrase}`;
 frame(0,`<div class="panel center"><div class="walkin">${animalSVG(c.n,'',170)}</div>
  <div class="bubble">${esc(text)}${spk(text)}</div><br>
  <button class="big" onclick="showBook(true)">Zoek het recept</button></div>`);
 sfx.pop();autoSay(text);
}
function showBook(inRound){
 cur='book';
 const head=inRound?`<div class="panel center orderhead">${animalSVG(R.cust.n,'',76)}<span class="q"><b>${R.cust.n}:</b> "${esc(R.phrase)}"</span>${spk(R.phrase)}<p class="small" style="width:100%">Wat moet je bakken? Klik op het goede recept.</p></div>`
  :`<div class="panel center"><h2>Receptenboek</h2><p class="small">Verdien sterren om nieuwe recepten vrij te spelen.</p></div>`;
 const card=r=>{
  const open=r.need<=S.stars,cnt=S.counts[r.id]||0;
  const inner=`${thumb(r,isCup(r)?130:110)}<div>${cap(r.name).replace('cupcake','&shy;cupcake')}</div>${open?(cnt&&!inRound?`<div class="cnt-badge">${cnt} gebakken</div>`:''):`<div class="need">slotje: ${r.need} ${starI(16)} nodig</div>`}${!inRound&&open?`<ul>${Object.entries(r.ing).map(([k,n])=>`<li>${ico(k,22,false)} ${amt(k,n)}</li>`).join('')}<li>${r.min} minuten in de oven</li><li>€${r.price}${isCup(r)?' per stuk':''}</li></ul>`:''}`;
  return inRound&&open?`<button class="card" id="card-${r.id}" onclick="chooseRecipe('${r.id}')">${inner}</button>`:`<div class="card ${open?'':'locked'}">${inner}</div>`;
 };
 const cardsHTML=`<div class="panel"><h3>Taarten</h3><div class="cards">${RECIPES.filter(r=>!isCup(r)).map(card).join('')}</div></div><div class="panel"><h3>Cupcakes <span class="small">(1 bakplaat = 6 cupcakes)</span></h3><div class="cards">${RECIPES.filter(isCup).map(card).join('')}</div></div>`;
 frame(inRound?1:null,`${head}${cardsHTML}`+(inRound?'':`<div class="btnrow" style="margin-top:16px"><button class="big" onclick="showHome()">Terug</button></div>`));
}
function chooseRecipe(id){
 if(id===R.recipe.id){sfx.ok();showPantry();return}
 R.errA=true;sfx.no();shake($('card-'+id));
 toast(`Dat is de ${RECIPES.find(r=>r.id===id).name}. Lees nog eens wat ${R.cust.n} vraagt!`);
}

/* ---------- pantry ---------- */
const target=k=>(R.recipe.ing[k]||0)*R.qty;
function pantryDone(){const r=R.recipe;return Object.keys(r.ing).every(k=>R.bowl[k]===target(k))&&Object.keys(R.bowl).every(k=>r.ing[k])}
function showPantry(){
 cur='pantry';const r=R.recipe,two=R.qty===2;
 const list=Object.entries(r.ing).map(([k,n])=>{const h=R.bowl[k]||0,t=target(k);return `<li class="${h===t?'done':h>t?'over':''}">${ico(k,38)}<span>${amt(k,n)}</span><span class="cnt">${h}/${two&&h!==t?'?':t}</span></li>`}).join('');
 const bowl=Object.entries(R.bowl).map(([k,n])=>Array(n).fill(`<button onclick="remIng('${k}')" title="Eruit halen">${ico(k,40,false)}</button>`).join('')).join('');
 frame(2,`<div class="grid2b">
  <div class="panel"><h3 class="withimg">${thumb(r,56)} ${cap(r.name)}</h3>${two?`<div class="hint">${isCup(r)?`Je bakt <b>${R.cups} cupcakes</b>: dat zijn 2 bakplaten!`:'Je bakt <b>2 taarten</b>!'} Neem van alles het dubbele.</div>`:''}<p class="small">${isCup(r)?'Recept voor 1 bakplaat (6 cupcakes):':two?'Recept voor 1 taart:':'Dit heb je nodig:'}</p><ul class="rlist">${list}</ul></div>
  <div class="panel center"><h3>De kom</h3><div class="bowl" id="bowl">${bowl||'<span class="small" style="align-self:center">Nog leeg...</span>'}</div>
   <p class="small">Te veel erin? Klik in de kom om het eruit te halen.</p>
   <button class="big" ${pantryDone()?'':'disabled'} onclick="showMix()">Klaar! Gaan mixen</button></div></div>
  <div class="panel"><h3>De voorraadkast</h3><p class="small">Zoek de goede ingrediënten en klik erop.</p>
  <div class="shelf">${R.shelf.map(k=>`<button class="ing" id="ing-${k}" onclick="addIng('${k}')">${ico(k,58)}<span>${ING[k].l}</span></button>`).join('')}</div></div>`);
}
function rerenderPantry(){const y=window.scrollY;showPantry();window.scrollTo(0,y)}
function addIng(k){
 const r=R.recipe,t=target(k);
 if(!t){R.errA=true;sfx.no();shake($('ing-'+k));toast(`Er hoort geen ${ING[k].l} in een ${r.name}!`);return}
 const rect=$('ing-'+k).getBoundingClientRect();
 R.bowl[k]=(R.bowl[k]||0)+1;rerenderPantry();fly(rect,'#bowl',k);
 if(R.bowl[k]>t){R.errA=true;sfx.no();toast(`Oei, te veel ${ING[k].l}! Je hebt er maar ${t} nodig.`)}
 else{sfx.pop();if(pantryDone()){sfx.ok();toast('Alles is er! Nu gaan mixen.',true)}}
}
function remIng(k){R.bowl[k]--;if(!R.bowl[k])delete R.bowl[k];sfx.pop();rerenderPantry()}

/* ---------- mix ---------- */
const STIRS=10;
function mixKeys(){const out=[];Object.keys(R.recipe.ing).forEach(k=>{for(let i=0;i<Math.min(target(k),3);i++)out.push(k)});return out.slice(0,14)}
function showMix(){
 cur='mix';
 frame(3,`<div class="panel center"><h2>Roer het beslag!</h2><p class="q">Klik ${STIRS} keer op de kom.</p>
  <div class="mixbowl" id="mixbowl" onclick="stir()">${bowlSVG(0,mixKeys(),R.recipe.color,-20)}</div>
  <div class="bar"><div id="mixbar"></div></div><p class="q" id="mixcount">0 / ${STIRS}</p><div id="mixnext"></div></div>`);
}
function stir(){
 if(R.stirs>=STIRS)return;R.stirs++;sfx.pop();
 const f=R.stirs/STIRS;
 $('mixbowl').innerHTML=bowlSVG(f,mixKeys(),R.recipe.color,R.stirs%2?25:-25);
 $('mixbar').style.width=f*100+'%';$('mixcount').textContent=`${R.stirs} / ${STIRS}`;
 if(R.stirs===STIRS){sfx.ok();$('mixnext').innerHTML=`<button class="big" onclick="showOven()">In de vorm en naar de oven</button>`}
}

/* ---------- oven ---------- */
function ovenInner(raw,grow){const r=R.recipe;const sc=grow||1;
 return isCup(r)?cupSVG(r,{count:Math.min(R.cups,6),raw,nest:1,x:38,y:118-28*sc,w:124,h:62*sc}):cakeSVG(r,{raw,nest:1,x:100-52*sc,y:186-92*sc,w:104*sc,h:98*sc});}
function showOven(){
 cur='oven';const r=R.recipe;
 frame(4,`<div class="grid2">
  <div class="panel center" id="ovenctl"><h3>In het recept staat:</h3><p class="q">Bakken: <b>${r.min} minuten</b></p>
   <p>Zet de oven op precies ${r.min} minuten.</p>
   <div class="dial" id="dial">${R.oven} min</div>
   <div class="btnrow"><button class="dbtn" onclick="dial(10)">+10</button><button class="dbtn" onclick="dial(5)">+5</button><button class="dbtn" onclick="dial(1)">+1</button><button class="dbtn" onclick="dial(-1)">−1</button><button class="dbtn" onclick="dial(0)">0</button></div>
   <button class="big" onclick="ovenOn()">Oven aan!</button></div>
  <div class="panel center" id="oven">${ovenSVG(false,ovenInner(true,.9),'')}</div></div>`);
}
function dial(n){R.oven=n===0?0:Math.max(0,Math.min(99,R.oven+n));$('dial').textContent=R.oven+' min';sfx.pop()}
function ovenOn(){
 const m=R.recipe.min;
 if(R.oven===m){bake();return}
 R.errB=true;sfx.no();shake($('dial'));
 if(R.oven<m)toast(`Te kort! Je hebt ${R.oven} minuten. Het recept zegt ${m}. Hoeveel moet erbij?`);
 else toast(`Te lang! Dan wordt de taart zwart. Je hebt ${R.oven}, het moet ${m} zijn.`);
}
function bake(){
 $('ovenctl').style.pointerEvents='none';$('ovenctl').style.opacity=.6;sfx.ok();
 let t=R.recipe.min;const step=Math.max(40,Math.round(3600/t));
 const iv=setInterval(()=>{
  if(cur!=='oven'){clearInterval(iv);return}
  const f=1-t/R.recipe.min;
  $('oven').innerHTML=ovenSVG(true,ovenInner(t>0,.9+f*.12),t+' min');
  if(t===0){clearInterval(iv);sfx.ding();setTimeout(()=>{if(cur==='oven')showClock()},900)}
  t--;
 },step);
}

/* ---------- clock question ---------- */
function timeText(totalMin){const h=Math.floor(totalMin/60),m=totalMin%60,hh=((h-1)%12)+1,nx=(h%12)+1;
 return m===0?`${hh} uur`:m===15?`kwart over ${hh}`:m===30?`half ${nx}`:`kwart voor ${nx}`}
function showClock(){
 cur='clock';const r=R.recipe,end=R.start+r.min,cup=isCup(r);
 const correct=timeText(end);
 const pool=[15,30,45,60,75,90].map(x=>timeText(R.start+x)).filter(t=>t!==correct);
 const nOpt=lvl()==='makkelijk'?1:2;
 const opts=shuffle([{t:correct,ok:1},...shuffle(pool).slice(0,nOpt).map(t=>({t,ok:0}))]);
 const q=`${cup?'De cupcakes gingen':'De taart ging'} om ${timeText(R.start)} de oven in. ${cup?'Ze bakten':'Hij bakte'} ${r.min} minuten. Hoe laat ${cup?'waren ze':'was hij'} klaar?`;
 frame(4,`<div class="panel center"><h2>Ting! ${cup?'De cupcakes zijn':'De taart is'} klaar!</h2>
  ${cakes(r,{w:cup?260:180})}
  <p class="q">${cup?'De cupcakes gingen':'De taart ging'} om <b>${timeText(R.start)}</b> de oven in.<br>${cup?'Ze bakten':'Hij bakte'} <b>${r.min} minuten</b>. Hoe laat ${cup?'waren ze':'was hij'} klaar? ${spk(q)}</p>
  ${clockSVG(R.start)}
  <div class="opts">${opts.map((o,i)=>`<button class="opt" id="opt${i}" onclick="clockAns(${i},${o.ok})">${o.t}</button>`).join('')}</div>
  <p class="small">Tip: 15 minuten = een kwartier · 30 minuten = een half uur · 60 minuten = een uur</p></div>`);
 autoSay(q);
}
function clockAns(i,ok){
 if(ok){sfx.ok();toast('Goed zo! Helemaal goed gerekend.',true);setTimeout(showDeco,900);return}
 R.errB=true;sfx.no();shake($('opt'+i));toast('Nog niet. Tel kwartier voor kwartier verder vanaf '+timeText(R.start)+'.');
}

/* ---------- decorate ---------- */
function showDeco(){
 cur='deco';const r=R.recipe,w=R.wish;
 frame(5,`<div class="panel center"><h2>Versier de ${isCup(r)?'cupcakes':'taart'}</h2>
  ${w?`<div class="wish">${animalSVG(R.cust.n,'',40)} ${R.cust.n} wil: <b>${wishText(w)}</b></div>${spk(R.cust.n+' wil een taart '+wishText(w))}`:`<p class="small">Maak hem zo mooi als je wilt! Klik op de versiering.</p>`}
  <div id="decocake">${cakes(r,{deco:R.deco,single:true,w:isCup(r)?330:260})}</div>
  <div class="decos">${Object.entries(DECO).map(([k,d])=>`<button onclick="addDeco('${k}')">${ico(DI(k),50)}<small>${d[1]}</small></button>`).join('')}</div>
  <p class="q" id="decocount"></p>
  <div class="btnrow"><button class="big lila" onclick="clearDeco()">Alles eraf</button><button class="big" onclick="decoDone()">Klaar met versieren</button></div></div>`);
 updDeco();
}
function updDeco(){const r=R.recipe;$('decocake').innerHTML=cakes(r,{deco:R.deco,single:true,w:isCup(r)?330:260});
 const counts={};R.deco.forEach(k=>counts[k]=(counts[k]||0)+1);
 $('decocount').textContent=R.deco.length?Object.entries(counts).map(([k,n])=>`${n} ${n===1?DECO[k][0]:DECO[k][1]}`).join(' · '):'';}
function addDeco(k){if(R.deco.length>=(isCup(R.recipe)?12:10)){sfx.no();toast('Er past niets meer op! Haal er eerst wat af.');return}R.deco.push(k);sfx.pop();updDeco()}
function clearDeco(){R.deco=[];sfx.pop();updDeco()}
function decoDone(){
 const w=R.wish;
 if(w){const n=R.deco.filter(k=>k===w.k).length;
  if(n!==w.n){if(!R.wishTried)R.errW=true;R.wishTried=true;sfx.no();shake($('decocake'));
   toast(`${R.cust.n} wil ${NUM[w.n]} ${w.n===1?DECO[w.k][0]:DECO[w.k][1]}. Je hebt er ${n}. ${n<w.n?'Er moeten er nog '+(w.n-n)+' bij.':'Haal er '+(n-w.n)+' af.'}`);return}
  R.wishTried=true;toast(`Precies wat ${R.cust.n} wilde!`,true);
 }
 sfx.ok();setTimeout(showFace,w?900:200);
}

/* ---------- face (last baking step, always 5 choices) ---------- */
function showFace(){
 cur='face';const r=R.recipe;
 const col=r.color,ink=lum(col)<.42?'#fff6ec':L;
 frame(6,`<div class="panel center"><h2>Kies een gezichtje</h2><p class="small">De laatste stap: welk gezichtje krijgt ${isCup(r)?'jouw cupcake':'jouw taart'}?</p>
  <div id="facecake">${cakes(r,{deco:R.deco,face:R.face,single:true,w:isCup(r)?330:260})}</div>
  <div class="faces">${FACES.map(([k,l])=>`<button class="facebtn ${R.face===k?'on':''}" onclick="pickFace('${k}')"><svg viewBox="0 0 64 64" width="74" height="74" aria-hidden="true"><circle cx="32" cy="32" r="28" fill="${col}" stroke="${L}" stroke-width="3"/>${face(32,29,2.1,k,ink)}</svg><span>${l}</span></button>`).join('')}</div>
  <button class="big" ${R.face?'':'disabled'} onclick="faceDone()">Dit gezichtje!</button></div>`);
}
function pickFace(k){R.face=k;sfx.pop();const y=window.scrollY;showFace();window.scrollTo(0,y)}
function faceDone(){if(!R.face)return;sfx.ok();showWrite()}

/* ---------- write name ---------- */
function showWrite(){
 cur='write';const r=R.recipe,c=R.cust,cup=isCup(r);
 frame(7,`<div class="grid2"><div class="panel center">${cakes(r,{name:cup?undefined:'',deco:R.deco,face:R.face,single:true,w:cup?300:240})}${cup?`<div class="cupbox"><span id="cname"></span></div>`:''}</div>
  <div class="panel center"><h2>Schrijf de naam op ${cup?'de doos':'de taart'}</h2>
   <div class="bon"><b>Bestelbon</b>${animalSVG(c.n,'',64)}<span class="nm">${c.n}</span>${count()>1?count()+' × ':''}${r.name}</div>
   <input class="txt" id="nameIn" maxlength="12" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Typ de naam" oninput="$('cname').textContent=this.value" onkeydown="if(event.key==='Enter')checkName()"><br>
   <button class="big" onclick="checkName()">${cup?'Op de doos!':'Op de taart!'}</button></div></div>`);
 setTimeout(()=>$('nameIn')&&$('nameIn').focus(),50);
}
function checkName(){
 const v=$('nameIn').value.trim(),n=R.cust.n;
 if(!v){shake($('nameIn'));toast('Typ eerst de naam.');return}
 if(v.toLowerCase()===n.toLowerCase()){
  R.written=v;sfx.ok();
  toast(v[0]===v[0].toUpperCase()?'Prachtig! En met een hoofdletter, net als een echte naam.':'Goed geschreven! Tip: een naam begint met een hoofdletter.',true);
  setTimeout(showPay,1300);return;
 }
 let i=0;while(i<v.length&&i<n.length&&v[i].toLowerCase()===n[i].toLowerCase())i++;
 sfx.no();shake($('nameIn'));
 toast(i>=n.length?'Er staan te veel letters. Kijk goed naar de bestelbon.':`Bijna! Kijk nog eens naar letter ${i+1}.`);
}

/* ---------- pay ---------- */
function showPay(){
 cur='pay';R.ans='';const r=R.recipe,c=R.cust,n=count(),two=n>1;
 const q=two?`Een ${r.name} kost ${r.price} euro. ${c.n} koopt er ${NUM[n]} en betaalt met een briefje van ${R.paid} euro. Hoeveel wisselgeld krijgt ${c.n} terug?`:`Een ${r.name} kost ${r.price} euro. ${c.n} betaalt met een briefje van ${R.paid} euro. Hoeveel wisselgeld krijgt ${c.n} terug?`;
 frame(8,`<div class="panel center"><h2>Afrekenen</h2>
  <div class="payrow"><div class="tag">${thumb(r,64)}<div>${cap(r.name)}${two?' (per stuk)':''}</div><b>€ ${r.price}</b></div>${two?`<span class="times">× ${n}</span>`:''}${animalSVG(c.n,'',90)}${billSVG(R.paid)}</div>
  <p class="q">${two?`${c.n} koopt er <b>${n}</b> en betaalt`:`${c.n} betaalt`} met een briefje van <b>€ ${R.paid}</b>.<br>Hoeveel wisselgeld krijgt ${c.n} terug? ${spk(q)}</p>
  ${two&&lvl()==='makkelijk'?`<div class="hint">Samen kost dat ${n} × €${r.price} = €${R.total}</div><br>`:''}<div class="answer" id="ansbox">€ <span id="ans"></span></div>
  <div class="keypad">${[1,2,3,4,5,6,7,8,9,'⌫',0,'✓'].map(k=>`<button class="${k==='✓'?'ok':''}" onclick="key('${k}')">${k}</button>`).join('')}</div></div>`);
 autoSay(q);
}
function key(k){
 if(k==='⌫')R.ans=R.ans.slice(0,-1);
 else if(k==='✓'){checkPay();return}
 else if(R.ans.length<2)R.ans+=k;
 $('ans').textContent=R.ans;sfx.pop();
}
function checkPay(){
 const want=R.paid-R.total;
 if(R.ans==='')return;
 if(Number(R.ans)===want){sfx.ok();showDone();return}
 R.errB=true;sfx.no();shake($('ansbox'));R.ans='';$('ans').textContent='';
 toast(count()>1?`Nog niet. Reken eerst: ${count()} × ${R.recipe.price} = ? Tel dan verder tot ${R.paid}.`:`Nog niet. Tel verder: van ${R.total} naar ${R.paid}. Hoeveel stappen is dat?`);
}
document.addEventListener('keydown',e=>{
 if(cur!=='pay'||$('ov'))return;
 if(/^[0-9]$/.test(e.key))key(e.key);else if(e.key==='Backspace')key('⌫');else if(e.key==='Enter')key('✓');
});

/* ---------- done ---------- */
function showDone(){
 cur='done';const r=R.recipe,c=R.cust,cup=isCup(r);
 const wishStar=R.wish&&!R.errW?1:0;
 const n=1+(R.errA?0:1)+(R.errB?0:1)+wishStar;
 const before=S.stars;S.stars+=n;S.baked++;S.coins+=R.total;S.counts[r.id]=(S.counts[r.id]||0)+count();save();
 const fresh=RECIPES.filter(x=>x.need>before&&x.need<=S.stars);
 const line=(ok,t)=>`<div class="${ok?'':'off'}">${starI(22,!ok)} ${t}${ok?'':' (volgende keer!)'}</div>`;
 const say2=(cup||R.qty===2)?FACE_SAY[R.face].replace('Hij ','Ze ').replace('knipoogt','knipogen').replace('lacht','lachen').replace('kijkt','kijken').replace('steekt zijn','steken hun'):FACE_SAY[R.face];
 frame(9,`<div class="panel center"><div class="blockc">${animalSVG(c.n,'happy',170)}</div>
  <div class="bubble">Dankjewel! Wat ${cup?'lekkere cupcakes':R.qty===2?'mooie taarten':'een mooie '+r.name}! ${say2}</div>
  ${cakes(r,{name:cup?undefined:R.written,deco:R.deco,face:R.face,w:cup?300:220})}${cup?`<div class="cupbox">${esc(R.written)}</div>`:''}
  <h2>Je verdient ${n} ${n===1?'ster':'sterren'}! ${Array(n).fill(starI(30)).join('')}</h2>
  <div class="earned">${line(true,'Bestelling geleverd')}${line(!R.errA,'Goed gezocht')}${line(!R.errB,'Goed gerekend')}${R.wish?line(!R.errW,'Wens vervuld'):''}</div>
  <p class="q">${coinI(26)} + €${R.total} in je spaarpot (nu €${S.coins})</p>
  ${fresh.map(x=>`<div class="unlock"><h3>Nieuw recept: ${cap(x.name)}!</h3>${thumb(x,120)}</div>`).join('')}
  <div class="btnrow"><button class="big" onclick="newRound()">Volgende klant</button><button class="big lila" onclick="showHome()">Naar huis</button></div></div>`);
 sfx.win();confetti();
}

showHome();
/* ---------- app: offline + terugknop ---------- */
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
try{history.pushState({g:1},'');window.addEventListener('popstate',()=>{history.pushState({g:1},'');if($('ov')){closeParent();return}if(cur!=='home')showHome()})}catch(e){}
</script>
</body>
